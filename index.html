<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>回声信使</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 进度指示器 -->
        <div class="progress-container">
            <div class="fragment" id="fragment1"></div>
            <div class="fragment" id="fragment2"></div>
            <div class="fragment" id="fragment3"></div>
        </div>

        <!-- 关卡指示器 -->
        <div class="level-indicator" id="levelIndicator">第一关：寂静森林</div>

        <!-- 声音波纹容器 -->
        <div id="rippleContainer"></div>

        <!-- 声音分析可视化 -->
        <div class="sound-visualizer" id="soundVisualizer">
            <!-- 动态生成 -->
        </div>

        <!-- 状态提示 -->
        <div class="status-hint" id="statusHint"></div>

        <!-- 游戏引导 -->
        <div class="guide-overlay" id="guideOverlay">
            <div class="guide-circle"></div>
            <div class="guide-text">点击白色按钮开始</div>
        </div>

        <!-- 通关提示 -->
        <div class="victory-overlay" id="victoryOverlay">
            <div class="victory-title">通过!</div>
            <div class="victory-subtitle" id="victorySubtitle">进入下一关</div>
        </div>

        <!-- 按钮容器 -->
        <div class="buttons-container">
            <button class="btn-record" id="btnRecord"></button>
            <button class="btn-play" id="btnPlay" disabled></button>
            <button class="btn-help" id="btnHelp"></button>
        </div>

        <!-- 调试面板 -->
        <div class="debug-panel" id="debugPanel">
            <div><span class="label">频率:</span> <span id="debugFreq">0</span> Hz</div>
            <div><span class="label">时长:</span> <span id="debugDuration">0</span> s</div>
            <div><span class="label">音量:</span> <span id="debugVolume">0</span></div>
            <div><span class="label">方差:</span> <span id="debugVariance">0</span></div>
            <div><span class="label">动作:</span> <span id="debugAction">-</span></div>
            <div><span class="label">位置:</span> <span id="debugPos">0, 0</span></div>
            <div><span class="label">关卡:</span> <span id="debugLevel">1</span></div>
            <div><span class="label">碎片:</span> <span id="debugFragments">0/3</span></div>
        </div>
    </div>

    <script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/recorder.js"></script>
<script src="js/utils.js"></script>
<script src="js/init.js"></script>
<script src="js/progress.js"></script>
<script src="js/main.js"></script>
</body>
</html>
